<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="container">

        <h1>Live Profile Card Generator</h1>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name"><br><br>
        
        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Enter your age"><br><br>
        
        <label for="college">College:</label>
        <input type="text" id="college" placeholder="Enter your college"><br><br>
        
        <div class="card">
            <p id="previewName">Name : Not provided </p>
            <p id="previewAge">Age : Not provided </p>
            <p id="previewCollege">College : Not provided </p>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
